name: Wikidata Sync

on:
  schedule:
    # 每天 03:00 UTC 跑一次 dry-run 健康檢查
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - apply

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wikidata
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: wikidata/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure pywikibot
        env:
          WIKIDATA_USERNAME: ${{ secrets.WIKIDATA_USERNAME }}
          WIKIDATA_PASSWORD: ${{ secrets.WIKIDATA_PASSWORD }}
        run: |
          cp user-config.py.example user-config.py
          cat > user-password.py <<EOF
          ("$WIKIDATA_USERNAME", BotPassword("symcio-bot", "$WIKIDATA_PASSWORD"))
          EOF
          chmod 600 user-password.py

      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "flag=--dry-run" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.mode }}" = "apply" ]; then
            echo "flag=" >> "$GITHUB_OUTPUT"
          else
            echo "flag=--dry-run" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync items
        if: hashFiles('wikidata/data/items.json') != ''
        run: python sync_items.py --input data/items.json ${{ steps.mode.outputs.flag }} -v

      - name: Commit QID updates
        if: inputs.mode == 'apply'
        run: |
          cd ..
          if ! git diff --quiet wikidata/data/items.json; then
            git config user.name 'symcio-bot'
            git config user.email 'bot@symcio.com'
            git add wikidata/data/items.json
            git commit -m 'chore(wikidata): persist QIDs after sync'
            git push
          fi

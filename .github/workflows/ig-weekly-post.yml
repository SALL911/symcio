name: Weekly IG Carousel Post

on:
  schedule:
    # 每週一 01:00 UTC = 09:00 UTC+8
    - cron: "0 1 * * 1"
  workflow_dispatch:
    inputs:
      carousel_index:
        description: "手動指定第幾套（1-5）；留空則自動依週數輪換"
        required: false
        default: ""
      dry_run:
        description: "只導出 PNG，不真的發布到 IG（true/false）"
        required: false
        default: "false"

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ig-automation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright requests boto3
          python -m playwright install chromium
          python -m playwright install-deps

      - name: Export & Publish
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          FORCE_CAROUSEL_INDEX: ${{ inputs.carousel_index }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          cd scripts
          python run_weekly.py

      - name: Upload PNG artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slides-${{ github.run_number }}
          path: /tmp/symcio-slides/**/*.png
          if-no-files-found: ignore
          retention-days: 30
